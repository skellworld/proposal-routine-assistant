{% extends "base.html" %}
{% block title %}내 AI 연결 - 제안서 루틴 도우미{% endblock %}
{% block content %}
<h1>⚙ 내 AI 연결</h1>

<div class="card">
  <h2>분석에 사용할 AI</h2>
  <p class="muted">이 설정은 <b>{{ me.name }}</b>님 계정에만 적용됩니다. 내가 실행한 분석(비교 분석·체크리스트·추진 전략·목차 추출·템플릿 구조화)은 여기서 고른 AI와 내 키로 처리됩니다.</p>
  <div id="aiform"></div>
</div>

<div class="card">
  <h2>비밀번호 변경</h2>
  <form class="form-grid" id="pwf" style="max-width:420px">
    <label>현재 비밀번호<input type="password" name="current" autocomplete="current-password" required></label>
    <label>새 비밀번호 (8자 이상)<input type="password" name="new" autocomplete="new-password" required></label>
    <label>새 비밀번호 확인<input type="password" name="new2" autocomplete="new-password" required></label>
    <div><button class="btn">비밀번호 바꾸기</button></div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script type="text/x-page">
AiForm(document.getElementById("aiform"), {
  me: {{ me | tojson }}, local: {{ local | tojson }}, cli: {{ cli | tojson }},
  onSaved() { Router.refreshSidebar(); toast("AI 연결을 저장했습니다"); },
});
const pwf = document.getElementById("pwf");
pwf.onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(pwf));
  if (d.new !== d.new2) return toast("새 비밀번호 확인이 일치하지 않습니다", true);
  try { await api("PUT", "/api/me/password", { current: d.current, new: d.new }); pwf.reset(); toast("비밀번호를 바꿨습니다"); }
  catch (ex) { toast(ex.message, true); }
};
</script>
{% endblock %}
