{% extends "base.html" %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
  <h1 style="margin-bottom:6px">3. 핵심 추진 전략 추천</h1>
  <button class="btn sm no-print" id="regen" data-ai title="최신 분석 결과를 반영해 다시 추천받습니다">🔄 다시 추천</button>
</div>
<p class="muted" style="margin-top:0">RFP·공고서와 1~2단계 분석을 바탕으로 Claude가 추천한 이번 사업의 핵심 전략입니다. 따로 할 일은 없고, 제안서 작성 방향을 잡을 때 참고하세요.</p>
<div id="sbox"></div>
{% endblock %}
{% block scripts %}
<script type="text/x-page">
const PID = {{ p.id | tojson }};
let data = {{ (p.strategy or None) | tojson }};
const running = {{ strategy_running | tojson }};
const MEMBERS = {{ members | tojson }};      // 이 워크스페이스의 참여 회사 (첫 번째 = 주관사)
const COMPANY_SIG = {{ company_sig | tojson }};  // 현재 회사 구성·현황 저장본
const hasDocs = {{ ((((p.files.current_rfp or []) + (p.files.notice or [])) | length) > 0) | tojson }};

function render() {
  const box = document.getElementById("sbox");
  if (!data) return;
  const s = data.strategies || [];
  box.innerHTML = `
  ${companyNote()}
  <div class="concept">
    <div class="concept-label">제안 콘셉트</div>
    <div class="concept-title">“${esc(data.concept)}”</div>
    <div class="concept-desc">${esc(data.concept_desc)}</div>
  </div>
  <div class="strat-list">
    ${s.map((x, i) => `
    <div class="card strat">
      <div class="strat-head">
        <span class="strat-num">${i + 1}</span>
        <div style="flex:1">
          <div class="strat-title">${esc(x.title)}</div>
          <div class="strat-msg">${esc(x.message)}</div>
        </div>
      </div>
      <div class="strat-body">
        <div><div class="strat-k">근거</div><div>${esc(x.rationale)}</div></div>
        <div><div class="strat-k">제안서에 담을 실행 방안</div><ul class="tight">${(x.actions || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
        <div class="strat-tags">
          ${x.evaluation && x.evaluation !== "명시 없음" ? `<span class="stag eval">📊 ${esc(x.evaluation)}</span>` : ""}
          ${x.where ? `<span class="stag where">📍 ${esc(x.where)}</span>` : ""}
          ${x.our_edge ? `<span class="stag fit">🏢 우리 강점: ${esc(x.our_edge)}</span>` : ""}
        </div>
      </div>
    </div>`).join("")}
  </div>
  ${(data.gaps || []).length ? `<div class="card"><h2>🧩 우리 회사 보완 포인트</h2><ul class="tight">${data.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : ""}
  ${renderRoles(data.roles)}
  ${(data.cautions || []).length ? `<div class="card"><h2>⚠ 놓치면 안 되는 리스크</h2><ul class="tight caution">${data.cautions.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
  ${scoringLink(data.scoring)}
  <p class="muted">추천 시각: ${esc(data.generated_at || "")}</p>`;
}

function companyNote() {
  const applied = data.company_applied || "";
  const names = MEMBERS.map((m, i) => esc(m.name) + (i === 0 && MEMBERS.length > 1 ? "(주관)" : "")).join(" · ");
  const manage = `<a class="btn sm" href="/workspaces/${PID}">컨소시엄 구성 보기</a>`;
  if (!MEMBERS.some(m => m.has_profile))
    return `<div class="company-note off"><span>🏢 참여 회사(${names})의 현황이 등록되지 않아 일반 전략으로 추천했습니다.</span>
      <a class="btn sm" href="/company?c=${encodeURIComponent(MEMBERS[0].id)}">회사 현황 등록 →</a></div>`;
  const legacyMatch = MEMBERS.length === 1 && applied && applied === MEMBERS[0].updated_at;  // 회사 1개 시절 결과
  if (applied && (applied === COMPANY_SIG || legacyMatch))
    return `<div class="company-note"><span>🏢 ${MEMBERS.length > 1 ? "컨소시엄" : "참여 회사"} 현황(${names})을 종합한 맞춤 전략입니다.</span>${manage}</div>`;
  // 예전 형식(현황 저장 시각만 저장) 결과이거나 구성·현황이 바뀜
  const was = (data.company_names || []).join(" · ");
  return `<div class="company-note off"><span>🏢 ${applied ? `컨소시엄 구성 또는 회사 현황이 바뀌었습니다${was ? ` (추천 당시: ${esc(was)})` : ""}.` : "이 결과는 회사 현황 없이 추천됐습니다."}
    [🔄 다시 추천]을 누르면 현재 구성(${names})을 반영합니다.</span>${manage}</div>`;
}

function renderRoles(roles) {
  if (!(roles || []).length) return "";
  return `<div class="card"><h2>🤝 컨소시엄 역할 분담 (추천)</h2>
    <table class="grid"><thead><tr><th style="width:22%">회사</th><th>추천 역할</th><th style="width:38%">근거</th></tr></thead>
    <tbody>${roles.map(r => `<tr><td><b>${esc(r.company)}</b></td><td>${esc(r.role)}</td><td class="muted">${esc(r.basis)}</td></tr>`).join("")}</tbody></table></div>`;
}

function scoringLink(sc) {
  if (sc && sc.found === false) return "";
  return `<div class="company-note"><span>📊 평가 배점표와 항목별 연계 전략은 <b>4. 배점표</b> 탭에서 볼 수 있습니다.</span>
    <a class="btn sm" href="/workspaces/${PID}/scoring">배점표 보기 →</a></div>`;
}

function loading(msg) {
  const box = document.getElementById("sbox");
  const start = Date.now();
  box.innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="spinner"></div>
    <div>${msg}</div><div class="muted" id="selapsed">다른 화면으로 이동해도 계속 진행됩니다</div></div>`;
  const t = setInterval(() => {
    const el = document.getElementById("selapsed");
    if (!el) return clearInterval(t);
    el.textContent = `경과 ${Math.round((Date.now() - start) / 1000)}초 · 다른 화면으로 이동해도 계속 진행됩니다`;
  }, 1000);
  return () => clearInterval(t);
}

async function generate(force) {
  const stop = loading(force ? "최신 분석을 반영해 전략을 다시 추천받는 중..." : "Claude가 이 사업의 핵심 추진 전략을 정리하는 중...");
  try {
    data = await api("POST", `/api/projects/${PID}/strategy/generate`, { force: !!force });
    if (document.getElementById("sbox")) { render(); Router.refreshSidebar(); }
  } catch (e) {
    const box = document.getElementById("sbox");
    if (box) box.innerHTML = `<div class="card"><p class="bad">✖ ${esc(e.message)}</p></div>`;
  } finally { stop(); }
}

document.getElementById("regen").onclick = () => {
  if (data && !confirm("전략을 다시 추천받을까요? 지금 결과는 새 결과로 바뀝니다.")) return;
  generate(true);
};
if (data && !running) render();
else if (hasDocs && aiOn()) generate(false);  // 결과가 없거나 1단계에서 만드는 중이면 자동으로 받아온다
else document.getElementById("sbox").innerHTML = `<div class="card"><p class="muted" style="margin:0">${hasDocs
  ? "아직 추천 결과가 없습니다. AI를 연결하면 추천받을 수 있습니다."
  : "1단계에서 RFP 또는 공고서를 올리면 자동으로 추천합니다."}</p></div>`;
</script>
{% endblock %}
